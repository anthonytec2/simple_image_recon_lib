[build-system]
requires = ["setuptools>=42", "wheel", "pybind11>=2.6"]
build-backend = "setuptools.build_meta"

[project]
name = "simple_image_recon"
version = "1.0.0"
description = "Python bindings for SimpleImageReconstructor - event camera image reconstruction"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [
    {name = "Bernd Pfrommer", email = "bernd.pfrommer@gmail.com"}
]
keywords = ["event camera", "image reconstruction", "computer vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "matplotlib>=3.3",
    "opencv-python>=4.5",
]

[project.urls]
Homepage = "https://github.com/berndpfrommer/simple_image_recon_lib"
Repository = "https://github.com/berndpfrommer/simple_image_recon_lib"
Issues = "https://github.com/berndpfrommer/simple_image_recon_lib/issues"
